stages:
  - test

go-checks:
  stage: test
  image: golang:1.27.1
  script:
    - |
      unformatted="$(gofmt -l internal/usecase/pair_discovery.go internal/usecase/pair_discovery_test.go)"
      if [ -n "$unformatted" ]; then
        echo "Go files need formatting:"
        echo "$unformatted"
        exit 1
      fi
    - go build ./...
    - go test ./...
    - go vet ./...

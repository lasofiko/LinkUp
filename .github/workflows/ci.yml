name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Check formatting
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '*.go')"
          else
            files="$(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.go')"
          fi
          test -z "$files" || test -z "$(gofmt -l $files)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
